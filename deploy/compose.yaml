services:
  xiaozhi-ha-gateway:
    build:
      context: ..
      dockerfile: server_overlay/Dockerfile
    container_name: xiaozhi-ha-gateway
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    environment:
      TZ: Asia/Shanghai
      HA_URL: http://192.168.3.185:8123
      HA_TOKEN: ${HA_TOKEN:?HA_TOKEN must be set}
    ports:
      - "8000:8000"
      - "8003:8003"
    volumes:
      - ./data:/opt/xiaozhi-esp32-server/data
      # Mount only the downloaded ASR model. Mounting the whole models
      # directory would hide the Silero VAD model bundled in the base image.
      - ./models/sherpa-onnx-paraformer-zh-small-2024-03-09:/opt/xiaozhi-esp32-server/models/sherpa-onnx-paraformer-zh-small-2024-03-09:ro
    deploy:
      resources:
        limits:
          memory: 1700M

  ha-display-api:
    build:
      context: ..
      dockerfile: server_overlay/Dockerfile
    container_name: xiaozhi-ha-display-api
    restart: unless-stopped
    command: ["python", "-m", "ha_terminal.display_server"]
    environment:
      TZ: Asia/Shanghai
      HA_URL: http://192.168.3.185:8123
      HA_TOKEN: ${HA_TOKEN:?HA_TOKEN must be set}
    ports:
      - "8090:8090"
    deploy:
      resources:
        limits:
          memory: 180M
